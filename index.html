<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Agro Futuro Sustentável</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topo">
  <h1>🌿 Agro Futuro</h1>
  <p id="frase">Produzir mais, preservando sempre</p>

  <button id="temaBtn">🌙 Tema</button>
</header>

<nav class="menu">
  <a href="#impacto">Impacto</a>
  <a href="#acoes">Ações</a>
  <a href="#contato">Contato</a>
</nav>

<main>

<section id="impacto" class="box">
  <h2>Impacto Sustentável</h2>

  <p>Simule ações ecológicas:</p>

  <button onclick="adicionarAcao()">+ Ação Sustentável</button>
  <h3 id="contador">0</h3>

</section>

<section id="acoes" class="box">
  <h2>Boas Práticas</h2>

  <button onclick="mostrarPraticas()">Mostrar práticas</button>

  <div id="lista" class="hidden">
    <ul>
      <li>🌱 Plantio consciente</li>
      <li>💧 Economia de água</li>
      <li>🌳 Preservação ambiental</li>
      <li>🚜 Tecnologia no campo</li>
    </ul>
  </div>
</section>

<section id="contato" class="box">
  <h2>Fale com a gente</h2>

  <label>Nome:</label>
  <input type="text" id="nome">

  <button onclick="mensagem()">Enviar</button>

  <p id="resposta"></p>
</section>

</main>

<footer>
  <p>© 2026 Agro Futuro</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
